name: citizen_app
description: Ayni SOS — Citizen emergency reporting app
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  image_picker: ^1.1.2
  record: ^5.1.2
  cross_file: ^0.3.4
  permission_handler: ^11.3.1
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  ai_engine:
    path: ../../packages/ai_engine
  sync_engine:
    path: ../../packages/sync_engine
  mesh_transport:
    path: ../../packages/mesh_transport
  geo_service:
    path: ../../packages/geo_service
  ui_kit:
    path: ../../packages/ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
